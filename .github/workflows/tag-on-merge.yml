name: tag-on-merge

# Fires when a version bump (see bump-version.yml) lands on master via a
# reviewed PR merge. Detects the new version, tags it, publishes a GitHub
# Release, and calls straight into release.yml to build/publish everything.
#
# Releases created by the default GITHUB_TOKEN don't cascade-trigger the
# `release: published` event (GitHub blocks that to prevent recursive runs),
# so this calls release.yml directly via workflow_call instead of relying on
# that event.
#
# NOTE: the `tag` job hard-fails if the version's tag already exists, rather
# than setting a "should_release" output for `publish` to check. A job that
# calls a reusable workflow (`uses:`) conditioned on needs.<job>.outputs was
# observed to get skipped even with `always() &&` and a confirmed-true output
# — see https://github.com/orgs/community/discussions/26945. Failing loudly
# here is also more honest than a silent skip: re-pushing an already-tagged
# version is not an expected flow (bump-version.yml always computes a new one).
on:
  push:
    branches: [master]
    paths:
      - provider/base-schema.json

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version and fail if already tagged
        id: check
        run: |
          set -euo pipefail
          VERSION=$(python3 -c "import json; print(json.load(open('provider/base-schema.json'))['version'])")
          TAG="v$VERSION"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "::error::$TAG already exists — refusing to re-tag. Bump the version again (bump-version.yml) if you need a new release."
            exit 1
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.check.outputs.tag }}" \
            --target master \
            --title "Anvil ${{ steps.check.outputs.tag }}" \
            --generate-notes

  publish:
    needs: tag
    permissions:
      contents: write
      id-token: write
    uses: ./.github/workflows/release.yml
    with:
      tag_name: ${{ needs.tag.outputs.tag }}
